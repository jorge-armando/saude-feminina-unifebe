name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-android-apk.yml"

permissions:
  contents: read

concurrency:
  group: android-apk-main
  cancel-in-progress: false

jobs:
  build-apk:
    name: Compile and publish test APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Install app dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Generate native Android project
        working-directory: mobile-app
        run: npx expo prebuild --platform android --no-install

      - name: Compile release APK
        working-directory: mobile-app/android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --no-daemon -PreactNativeArchitectures=arm64-v8a,armeabi-v7a

      - name: Prepare APK artifact
        run: |
          mkdir -p output
          cp mobile-app/android/app/build/outputs/apk/release/app-release.apk output/saudefeminina.apk
          ls -lh output/saudefeminina.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SaudeFeminina-Android-APK
          path: output/saudefeminina.apk
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
